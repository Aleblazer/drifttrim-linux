[package]
name = "drifttrim"
description = "Ride app and device volume with faders on KDE Plasma"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
drifttrim-core = { path = "../drifttrim-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
alsa = "0.12"
hidapi = { version = "2.6", default-features = false, features = ["linux-shared-hidraw"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
libpulse-binding = "2.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
udev = "0.9"
zbus = "5"

[build-dependencies]
cxx-qt-build = "0.10"
